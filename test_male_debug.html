<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Male Character Picture-by-Picture Debugger</title>
  <style>
    body { background: #181820; color: #fff; font-family: sans-serif; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 10px; color: #4ade80; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .frame-box { background: #232330; border: 2px solid #3b3b4f; border-radius: 8px; padding: 10px; text-align: center; }
    .frame-box h3 { font-size: 14px; margin-bottom: 8px; color: #38bdf8; }
    canvas { background: #2a2a3c; border: 1px solid #555; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🔍 Phân Tích Hình Ảnh Từng Khung Hình (Picture-by-Picture) - Chàng Trai Tày</h1>
  <div class="grid" id="grid"></div>

  <script src="character-config.js"></script>
  <script>
    async function init() {
      const cfg = CHARACTER_CONFIG.getSkinConfig('nam_tay_khoe_khoan');
      const grid = document.getElementById('grid');

      // Load sprites
      const sprites = {};
      const entries = CHARACTER_CONFIG.getCharacterAssetEntries('nam_tay_khoe_khoan');
      for (const e of entries) {
        const img = new Image();
        img.src = e.src;
        await new Promise(r => img.onload = r);
        sprites[e.key] = img;
      }

      // Also load ball & pole
      const ballImg = new Image();
      ballImg.src = 'assets/character/attempt/clean/quacon_ball.png';
      await new Promise(r => ballImg.onload = r);

      const poses = [
        { name: '1. Đứng Chờ (Idle Stance)', handOffset: { x: 30, y: 120 } },
        { name: '2. Vung Tay Ra Sau (Windup Back)', handOffset: { x: -80, y: 30 } },
        { name: '3. Vung Tay Xuống Dưới (Swing Down)', handOffset: { x: 40, y: 150 } },
        { name: '4. Vung Tay Lên Cao (Swing High)', handOffset: { x: 90, y: -70 } },
        { name: '5. Buông Còn Phóng Đi (Release Throw)', handOffset: { x: 130, y: -40 } }
      ];

      poses.forEach(pose => {
        const box = document.createElement('div');
        box.className = 'frame-box';
        box.innerHTML = `<h3>${pose.name}</h3>`;

        const cvs = document.createElement('canvas');
        cvs.width = 400;
        cvs.height = 550;
        const ctx = cvs.getContext('2d');
        box.appendChild(cvs);
        grid.appendChild(box);

        drawPose(ctx, cvs.width, cvs.height, cfg, sprites, ballImg, pose.handOffset);
      });
    }

    function solveIK(l1, l2, dx, dy) {
      const d = Math.max(Math.abs(l1 - l2) + 0.1, Math.min(l1 + l2 - 0.1, Math.hypot(dx, dy)));
      const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
      const alpha = Math.acos(Math.max(-1, Math.min(1, cosA)));
      const cosB = (l1 * l1 + l2 * l2 - d * d) / (2 * l1 * l2);
      const beta = Math.acos(Math.max(-1, Math.min(1, cosB)));
      const theta = Math.atan2(dy, dx);
      const th1 = theta + alpha;
      const th2 = th1 - (Math.PI - beta);
      return { th1, th2 };
    }

    function drawPose(ctx, cw, ch, cfg, sprites, ballImg, handOffset) {
      ctx.clearRect(0, 0, cw, ch);

      const groundY = ch - 40;
      const groundX = cw / 2 - 20;

      // Ground Line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY); ctx.lineTo(cw, groundY);
      ctx.stroke();

      const sBody = 0.30;
      const footAnchor = cfg.anchors.footAnchor;
      const shoulderJoint = cfg.anchors.shoulderJoint;

      const bodyDrawX = groundX - footAnchor.x * sBody;
      const bodyDrawY = groundY - footAnchor.y * sBody;

      // 1. Draw Body
      ctx.drawImage(sprites.body, bodyDrawX, bodyDrawY, sprites.body.width * sBody, sprites.body.height * sBody);

      // Shoulder in world
      const shX = bodyDrawX + shoulderJoint.x * sBody;
      const shY = bodyDrawY + shoulderJoint.y * sBody;

      // Kinematics
      const sUpper = (cfg.kinematics.scaleUpper || 1.0) * sBody;
      const sFore = (cfg.kinematics.scaleFore || 1.0) * sBody;
      const sHand = (cfg.kinematics.scaleHand || 1.0) * sBody;

      const uP = cfg.kinematics.upperArm.shoulderPivot;
      const uE = cfg.kinematics.upperArm.elbowJoint;
      const uVec = { x: (uE.x - uP.x) * sUpper, y: (uE.y - uP.y) * sUpper };
      const L1 = Math.hypot(uVec.x, uVec.y);
      const uBaseAng = Math.atan2(uVec.y, uVec.x);

      const fP = cfg.kinematics.forearm.elbowPivot;
      const fW = cfg.kinematics.forearm.wristJoint;
      const fVec = { x: (fW.x - fP.x) * sFore, y: (fW.y - fP.y) * sFore };
      const L2 = Math.hypot(fVec.x, fVec.y);
      const fBaseAng = Math.atan2(fVec.y, fVec.x);

      const hP = cfg.kinematics.hand.wristPivot;
      const hG = cfg.kinematics.hand.gripTunnel;
      const hVec = { x: (hG.x - hP.x) * sHand, y: (hG.y - hP.y) * sHand };
      const hDist = Math.hypot(hVec.x, hVec.y);
      const hBaseAng = Math.atan2(hVec.y, hVec.x);

      const targetX = shX + handOffset.x;
      const targetY = shY + handOffset.y;

      const ik = solveIK(L1, L2, targetX - shX, targetY - shY);
      const th1 = ik.th1;
      const th2 = ik.th2;

      // Draw Upper Arm
      ctx.save();
      ctx.translate(shX, shY);
      ctx.rotate(th1 - uBaseAng);
      ctx.drawImage(sprites.upper_arm, -uP.x * sUpper, -uP.y * sUpper, sprites.upper_arm.width * sUpper, sprites.upper_arm.height * sUpper);
      ctx.restore();

      // Elbow in world
      const elbX = shX + L1 * Math.cos(th1);
      const elbY = shY + L1 * Math.sin(th1);

      // Draw Forearm
      ctx.save();
      ctx.translate(elbX, elbY);
      ctx.rotate(th2 - fBaseAng);
      ctx.drawImage(sprites.forearm, -fP.x * sFore, -fP.y * sFore, sprites.forearm.width * sFore, sprites.forearm.height * sFore);
      ctx.restore();

      // Wrist in world
      const wristX = elbX + L2 * Math.cos(th2);
      const wristY = elbY + L2 * Math.sin(th2);

      // Draw Hand
      ctx.save();
      ctx.translate(wristX, wristY);
      ctx.rotate(th2 - hBaseAng);
      ctx.drawImage(sprites.hand, -hP.x * sHand, -hP.y * sHand, sprites.hand.width * sHand, sprites.hand.height * sHand);
      ctx.restore();

      // Draw Joint points (for inspection)
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(shX, shY, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath(); ctx.arc(elbX, elbY, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#10b981';
      ctx.beginPath(); ctx.arc(wristX, wristY, 4, 0, Math.PI * 2); ctx.fill();

      // Draw Target
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.arc(targetX, targetY, 5, 0, Math.PI * 2); ctx.fill();

      // Cord to ball
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(wristX, wristY);
      ctx.lineTo(targetX, targetY);
      ctx.stroke();

      ctx.drawImage(ballImg, targetX - 15, targetY - 15, 30, 30);
    }

    window.onload = init;
  </script>
</body>
</html>
