<!DOCTYPE html>
<html>
<head><title>Process Male Tay Sprites</title></head>
<body style="background: #111; color: #fff;">
<h2>Processing Sprites...</h2>
<div id="status">Loading...</div>
<script>
async function run() {
  const status = document.getElementById('status');

  // Load images
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  try {
    const fullImg = await loadImage('assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_13 PM-1.png');
    const bodyImg = await loadImage('assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_15 PM-2.png');
    const sleeveImg = await loadImage('assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_18 PM-3.png');
    const armImg = await loadImage('assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_19 PM-4.png');
    const handImg = await loadImage('assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_20 PM-5.png');

    status.innerText = 'All images loaded. Standardizing layers...';

    // Target Standard Canvas Size: 1024 x 1536
    const W = 1024, H = 1536;

    // Helper to get canvas dataURL
    function makeCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      return c;
    }

    // 1. Process Body (1024 x 1536)
    // Clean body with right arm removed
    const bodyCvs = makeCanvas(W, H);
    const bodyCtx = bodyCvs.getContext('2d');
    bodyCtx.drawImage(bodyImg, 0, 0, W, H);

    // 2. Process Upper Arm / Sleeve
    // In full image, shoulder socket is at x: 350, y: 330
    // Sleeve is roughly 220px wide, 350px tall in master coordinates
    const uaCvs = makeCanvas(320, 600);
    const uaCtx = uaCvs.getContext('2d');
    // Draw sleeve scaled and positioned with shoulder pivot at top center (160, 100)
    uaCtx.drawImage(sleeveImg, 0, 0, 320, 600);

    // 3. Process Forearm
    // Forearm is roughly 80px wide, 240px tall in master coordinates
    const faCvs = makeCanvas(100, 300);
    const faCtx = faCvs.getContext('2d');
    faCtx.drawImage(armImg, 0, 0, 100, 300);

    // 4. Process Hand
    // Hand is roughly 120px wide, 110px tall in master coordinates
    const hCvs = makeCanvas(200, 200);
    const hCtx = hCvs.getContext('2d');
    hCtx.drawImage(handImg, 0, 0, 200, 200);

    // Send processed PNGs to backend server via POST
    async function upload(filename, canvas) {
      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.replace(/^data:image\/png;base64,/, '');
      await fetch('/save-sprite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename, base64 })
      });
    }

    await upload('assets/character/skins/nam_tay_moi/body_clean.png', bodyCvs);
    await upload('assets/character/skins/nam_tay_moi/upper_arm_std.png', uaCvs);
    await upload('assets/character/skins/nam_tay_moi/forearm_std.png', faCvs);
    await upload('assets/character/skins/nam_tay_moi/hand_std.png', hCvs);

    status.innerText = 'SUCCESS! Sprites processed and saved.';
  } catch (err) {
    status.innerText = 'Error: ' + err.message;
    console.error(err);
  }
}
run();
</script>
</body>
</html>
