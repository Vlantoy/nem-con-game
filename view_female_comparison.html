<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>So Sánh Tay Nhân Vật Nữ Trước & Sau</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; margin: 0; padding: 25px; }
    h1 { color: #f59e0b; margin-top: 0; font-size: 20px; }
    .compare-container { display: flex; gap: 30px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; text-align: center; }
    .card h2 { font-size: 15px; color: #38bdf8; margin-top: 0; margin-bottom: 12px; }
    canvas { background: radial-gradient(circle, #2d5a3f 0%, #152e20 100%); border-radius: 8px; border: 1px solid #475569; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #64748b; color: #fff; margin-left: 6px; }
    .badge.green { background: #10b981; }
  </style>
</head>
<body>
  <h1>👩 SO SÁNH NHÂN VẬT NỮ TRƯỚC & SAU KHI HIỆU CHỈNH</h1>
  <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">
    Toàn bộ cánh tay (bắp tay & cẳng tay) giảm 10% giúp dáng người thanh mảnh hơn, riêng bàn tay cầm còn tăng 10% giúp cầm nắm chắc chắn, rõ nét.
  </p>

  <div class="compare-container">
    <div class="card">
      <h2>1. TRƯỚC KHI CHỈNH <span class="badge">GỐC</span></h2>
      <canvas id="cvsBefore" width="380" height="520"></canvas>
    </div>
    <div class="card">
      <h2>2. SAU KHI CHỈNH (-10% Cánh tay, +10% Bàn tay) <span class="badge green">MỚI</span></h2>
      <canvas id="cvsAfter" width="380" height="520"></canvas>
    </div>
  </div>

  <script src="character-config.js"></script>
  <script>
    async function loadImg(s) {
      return new Promise((res, rej) => {
        const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = s;
      });
    }

    async function drawFemale(canvasId, isAfter) {
      const cvs = document.getElementById(canvasId);
      const ctx = cvs.getContext('2d');

      const body = await loadImg('assets/character/skins/skin_template/body.png');
      const upper = await loadImg('assets/character/skins/skin_template/upper_arm_unified.png');
      const fore = await loadImg('assets/character/skins/skin_template/forearm.png');
      const hand = await loadImg('assets/character/skins/skin_template/hand.png');

      const sBody = 0.28;
      const groundX = cvs.width / 2;
      const groundY = 490;

      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.ellipse(groundX, groundY, 70, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      const footAnchor = { x: 565, y: 1510 };
      const shoulderJoint = { x: 429, y: 360 };

      const bodyDrawX = groundX - footAnchor.x * sBody;
      const bodyDrawY = groundY - footAnchor.y * sBody;

      // 1. Body
      ctx.drawImage(body, bodyDrawX, bodyDrawY, body.width * sBody, body.height * sBody);

      // Shoulder
      const shoulderX = bodyDrawX + shoulderJoint.x * sBody;
      const shoulderY = bodyDrawY + shoulderJoint.y * sBody;

      // Kinematics:
      // Before: scaleUpper: 0.53, scaleFore: 1.15, scaleHand: 0.35, idleHandOffset: { x: 1, y: 86 }
      // After:  scaleUpper: 0.477, scaleFore: 1.035, scaleHand: 0.385, idleHandOffset: { x: 1, y: 77 }
      const scU = isAfter ? 0.477 : 0.53;
      const scF = isAfter ? 1.035 : 1.15;
      const scH = isAfter ? 0.385 : 0.35;
      const idleY = isAfter ? 77 : 86;

      const sUpper = scU * sBody;
      const sFore = scF * sBody;
      const sHand = scH * sBody;

      const uP = { x: 206, y: 208 };
      const uE = { x: 228, y: 603 };
      const uPiv = { x: uP.x * sUpper, y: uP.y * sUpper };
      const uElb = { x: uE.x * sUpper, y: uE.y * sUpper };
      const uVec = { x: uElb.x - uPiv.x, y: uElb.y - uPiv.y };
      const L1 = Math.hypot(uVec.x, uVec.y);
      const uBaseAng = Math.atan2(uVec.y, uVec.x);

      const fP = { x: 29, y: 20 };
      const fW = { x: 49, y: 200 };
      const fPiv = { x: fP.x * sFore, y: fP.y * sFore };
      const fWri = { x: fW.x * sFore, y: fW.y * sFore };
      const fVec = { x: fWri.x - fPiv.x, y: fWri.y - fPiv.y };
      const L2 = Math.hypot(fVec.x, fVec.y);
      const fBaseAng = Math.atan2(fVec.y, fVec.x);

      const hP = { x: 25, y: 180 };
      const hG = { x: 165, y: 135 };
      const hPiv = { x: hP.x * sHand, y: hP.y * sHand };
      const hGrip = { x: hG.x * sHand, y: hG.y * sHand };
      const hVec = { x: hGrip.x - hPiv.x, y: hGrip.y - hPiv.y };
      const hBaseAng = Math.atan2(hVec.y, hVec.x);

      // Solve IK for Idle
      const tgtX = shoulderX + 1 * (sBody / 0.21);
      const tgtY = shoulderY + idleY * (sBody / 0.21);

      const dx = tgtX - shoulderX;
      const dy = tgtY - shoulderY;
      let d = Math.hypot(dx, dy);
      const minD = Math.abs(L1 - L2) + 2;
      const maxD = L1 + L2 - 1.5;
      d = Math.max(minD, Math.min(maxD, d));

      const cosA = Math.max(-1, Math.min(1, (L1*L1 + d*d - L2*L2)/(2*L1*d)));
      const alpha = Math.acos(cosA);
      const cosB = Math.max(-1, Math.min(1, (L1*L1 + L2*L2 - d*d)/(2*L1*L2)));
      const beta = Math.acos(cosB);
      const theta = Math.atan2(dy, dx);

      const th1 = theta + alpha;
      const th2 = th1 - (Math.PI - beta);

      const elbowX = shoulderX + L1 * Math.cos(th1);
      const elbowY = shoulderY + L1 * Math.sin(th1);
      const wristX = elbowX + L2 * Math.cos(th2);
      const wristY = elbowY + L2 * Math.sin(th2);

      // 2. Draw Upper Arm (Original game.js order)
      ctx.save();
      ctx.translate(shoulderX, shoulderY);
      ctx.rotate(th1 - uBaseAng);
      ctx.drawImage(upper, -uPiv.x, -uPiv.y, upper.width * sUpper, upper.height * sUpper);
      ctx.restore();

      // 3. Draw Forearm (Original game.js order)
      ctx.save();
      ctx.translate(elbowX, elbowY);
      ctx.rotate(th2 - fBaseAng);
      ctx.drawImage(fore, -fPiv.x, -fPiv.y, fore.width * sFore, fore.height * sFore);
      ctx.restore();

      // 4. Draw Hand
      ctx.save();
      ctx.translate(wristX, wristY);
      ctx.rotate(th2 - hBaseAng);
      ctx.drawImage(hand, -hPiv.x, -hPiv.y, hand.width * sHand, hand.height * sHand);
      ctx.restore();
    }

    async function init() {
      await drawFemale('cvsBefore', false);
      await drawFemale('cvsAfter', true);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
