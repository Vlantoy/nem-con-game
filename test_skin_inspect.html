<!DOCTYPE html>
<html>
<head><title>Test Skin Inspector</title></head>
<body style="background: #222; color: #fff; font-family: sans-serif;">
<h2>Testing New Skin Assets</h2>
<canvas id="c" width="1200" height="1600" style="border: 1px solid #555;"></canvas>
<pre id="out"></pre>
<script>
async function test() {
  const images = {
    ref: 'assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_13 PM-1.png',
    body: 'assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_15 PM-2.png',
    sleeve: 'assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_18 PM-3.png',
    arm: 'assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_19 PM-4.png',
    hand: 'assets/character/skins/New skin/ChatGPT Image Oct 2, 2026, 10_30_20 PM-5.png'
  };

  const loaded = {};
  for (const [k, src] of Object.entries(images)) {
    const img = new Image();
    img.src = src;
    await new Promise(r => img.onload = r);
    loaded[k] = img;
  }

  function getBBox(img) {
    const tcvs = document.createElement('canvas');
    tcvs.width = img.width;
    tcvs.height = img.height;
    const tctx = tcvs.getContext('2d');
    tctx.drawImage(img, 0, 0);
    const data = tctx.getImageData(0, 0, img.width, img.height).data;
    let minX = img.width, maxX = 0, minY = img.height, maxY = 0;
    let transparentCount = 0, opaqueCount = 0, whiteCount = 0;
    for (let y = 0; y < img.height; y++) {
      for (let x = 0; x < img.width; x++) {
        const idx = (y * img.width + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
        if (a < 20) {
          transparentCount++;
        } else {
          opaqueCount++;
          if (r > 245 && g > 245 && b > 245) whiteCount++;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    return {
      width: img.width,
      height: img.height,
      bbox: { minX, maxX, minY, maxY, w: maxX - minX + 1, h: maxY - minY + 1 },
      transparentCount,
      opaqueCount,
      whiteCount,
      isTransparentBg: (transparentCount / (img.width * img.height)) > 0.2
    };
  }

  const results = {};
  for (const [k, img] of Object.entries(loaded)) {
    results[k] = getBBox(img);
  }
  document.getElementById('out').innerText = JSON.stringify(results, null, 2);
}
test();
</script>
</body>
</html>
